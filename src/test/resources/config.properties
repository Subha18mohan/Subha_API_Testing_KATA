# Test environment settings.
# Any value can be overridden on the command line, e.g.
#   mvn test -Dbase.url=https://another-server.com/api

# Root address of the API (every endpoint path is added to this)
base.url=https://automationintesting.online/api

# Administrator account used to log in (public demo account)
auth.username=admin
auth.password=password