# Settings for Cucumber, read automatically by the JUnit Platform.
# Any of them can be overridden on the command line with -Dkey=value.

# Name each Scenario Outline run after its scenario title with the
# Examples values filled in (e.g. "Login is refused for a wrong password")
# instead of "Example #1.1", so reports are readable.
cucumber.junit-platform.naming-strategy.long.example-name=pickle

# Do not print the "share your report on reports.cucumber.io" banner.
cucumber.publish.quiet=true


# Skip scenarios that document known, reported bugs (@known-bug) and work in
# progress (@wip), so the default build shows real regressions only.
# Run the known bugs explicitly with:  mvn test -Dcucumber.filter.tags="@known-bug"
cucumber.filter.tags=not @known-bug and not @wip